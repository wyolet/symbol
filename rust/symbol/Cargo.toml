[package]
name = "symbol-core"
version = "0.1.0"
edition = "2021"
description = "Rust port of symbol's core: index, reads, writes. Language analysis stays in native-AST daemons (pyscan, go-scan)."
license = "Apache-2.0"

[lib]
name = "symbol_core"
path = "src/lib.rs"

[[bin]]
name = "symbol-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
symbol-linguist = { path = "../linguist" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
