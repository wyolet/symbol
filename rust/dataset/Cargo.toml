[package]
name = "symbol-dataset"
version = "0.1.0"
edition = "2021"
description = "Mine, compose, and verify real-world symbol task datasets"
license = "Apache-2.0"

[[bin]]
name = "symbol-dataset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
