[package]
name = "symbol-harness"
version = "0.1.0"
edition = "2021"
description = "Stateful black-box feature harness for symbol-rs"
license = "Apache-2.0"

[[bin]]
name = "symbol-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
