name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-scan type-checks projects only up to the Go it was built with
          go-version: stable
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build go-scan (dev binary for GoAdapter tests)
        run: make build-go-scan
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
        continue-on-error: true  # TODO: clean up pre-existing lint debt, then make blocking
      - name: Test (pytest)
        run: uv run pytest -q
      - name: Lint Rust workspace
        run: make lint-rust
      - name: Test Rust workspace
        run: make test-rust
      - name: Test Rust feature scenarios
        run: make test-features
      - name: Test pinned real-world Rust scenarios
        run: make test-real-world
      - name: Upload Rust feature report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-feature-report-${{ matrix.python }}
          path: .tmp/feature-report.json
          if-no-files-found: warn
      - name: Upload real-world Rust feature report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-real-world-feature-report-${{ matrix.python }}
          path: .tmp/real-world-feature-report.json
          if-no-files-found: warn

  package:
    name: package
    # Platform wheels, standalone archives, and sdist, built as on release.
    uses: ./.github/workflows/build.yml
